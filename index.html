<script>
firebase.initializeApp({
    apiKey:"AIzaSyDiIG0HunGmHs-ptOee6qQE_WO9DVD7iUI",
    authDomain:"he-thong-872c1.firebaseapp.com",
    databaseURL:"https://he-thong-872c1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"he-thong-872c1",
    storageBucket:"he-thong-872c1.firebasestorage.app",
    messagingSenderId:"224259528337",
    appId:"1:224259528337:web:6358fcb1e783dcf6c69130"
});
const fb=firebase.database();
console.log('🔥 Firebase OK');

const AE='admin@tapl.com',AP='admin2024',DI='d_'+Math.random().toString(36).substr(2,9);
let DB={users:[],exams:[],subs:[],news:[],honors:[],contact:{email:'admin@tapl.com',phone:'0123 456 789',address:'Hà Nội',facebook:'#'},marquee:'🎯 Chào mừng TAPL - Phòng Luyện Đề Thi!',schedule:{}};
let ME=null,EX=null,pQ=null,_st=null,iLD=true,niD=null,hiD=null;

function ensureAdmin(){
    if(!DB.users)DB.users=[];
    if(!DB.exams)DB.exams=[];
    if(!DB.subs)DB.subs=[];
    if(!DB.news)DB.news=[];
    if(!DB.honors)DB.honors=[];
    if(!DB.schedule)DB.schedule={};
    if(!DB.contact)DB.contact={email:'admin@tapl.com',phone:'0123 456 789',address:'Hà Nội',facebook:'#'};
    if(!DB.marquee&&DB.marquee!=='')DB.marquee='🎯 Chào mừng TAPL!';
    
    // Auto-approve all pending accounts (no more approval needed)
    DB.users.forEach(u=>{if(u.status==='pending')u.status='approved'});
    
    let adm=DB.users.find(u=>u.email===AE);
    if(!adm){
        adm={id:1,name:'Admin',email:AE,password:AP,role:'admin',status:'approved',devices:[],locked:false,createdAt:new Date().toISOString()};
        DB.users.unshift(adm);
        console.log('✅ Admin created');
    }else{
        adm.password=AP;adm.role='admin';adm.status='approved';adm.locked=false;
        if(!adm.devices)adm.devices=[];
    }
}

function sv(){
    clearTimeout(_st);
    _st=setTimeout(()=>{
        try{localStorage.setItem('tapl6',JSON.stringify(DB))}catch(e){}
        fb.ref('tapl').set(DB).then(()=>console.log('☁️ Saved')).catch(e=>console.error('Save err:',e));
    },300);
}

function loadData(cb){
    fb.ref('tapl').once('value').then(snap=>{
        const d=snap.val();
        if(d)DB=Object.assign({},DB,d);
        ensureAdmin();
        try{localStorage.setItem('tapl6',JSON.stringify(DB))}catch(e){}
        sv();
        if(cb)cb();
    }).catch(e=>{
        console.error('❌ Firebase err:',e);
        try{const d=localStorage.getItem('tapl6');if(d)DB=Object.assign({},DB,JSON.parse(d))}catch(e2){}
        ensureAdmin();
        tt('⚠️ Offline mode','wn');
        if(cb)cb();
    });
}

function rtSync(){
    fb.ref('tapl').on('value',snap=>{
        if(iLD){iLD=false;return}
        const d=snap.val();if(!d)return;
        const ou=DB.users?.length||0,oe=DB.exams?.length||0,os=DB.subs?.length||0;
        DB=Object.assign({},DB,d);
        ensureAdmin();
        if(ME){
            if((DB.users?.length||0)>ou&&ME.role==='admin')tt('🆕 TK mới đăng ký!','in');
            if((DB.exams?.length||0)>oe&&ME.role==='student')tt('🆕 Đề mới!','in');
            if((DB.subs?.length||0)>os&&ME.role!=='student')tt('🆕 Bài nộp!','in');
        }
        try{localStorage.setItem('tapl6',JSON.stringify(DB))}catch(e){}
        refreshCurrentPage();uUI();uMq();
    });
}

function refreshCurrentPage(){
    const ap=document.querySelector('.pg.on');if(!ap)return;
    const m={pgHome:rH,pgExams:rEx,pgGrade:rGr,pgStudents:rSt,pgNews:rNw,pgAdmin:rAd,pgApprovals:rAp,pgNewsEd:rNE,pgLb:rLb,pgSettings:rSe,pgSchedule:rSch,pgHonor:rHn,pgProfile:rPr};
    const f=m[ap.id];if(f)f();
}

// AUTH
function shA(){document.getElementById('aM').classList.add('show');swA('l')}
function clsA(){document.getElementById('aM').classList.remove('show')}
function swA(t){
    document.querySelectorAll('.at').forEach((e,i)=>e.classList.toggle('on',t===['l','r'][i]));
    ['fL','fR','fLk'].forEach(id=>document.getElementById(id).classList.remove('on'));
    const map={l:'fL',r:'fR',k:'fLk'};
    document.getElementById(map[t]||'fL').classList.add('on');
    ['lEr','rEr','lOk'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none'});
}

function doLg(){
    const email=document.getElementById('lE').value.trim();
    const pass=document.getElementById('lP').value;
    if(!email||!pass){sErr('lEr','Nhập đầy đủ!');return}
    const u=DB.users?.find(x=>x.email===email&&x.password===pass);
    if(!u){sErr('lEr','Sai email hoặc mật khẩu!');return}
    if(u.locked){swA('k');return}
    if(!u.devices)u.devices=[];
    if(u.role!=='admin'){
        if(!u.devices.includes(DI)){
            if(u.devices.length>=2){u.locked=true;sv();swA('k');return}
            u.devices.push(DI);sv();
        }
    }
    ME=u;clsA();uUI();nv('home');tt('Chào '+ME.name+'! 👋','in');
}

function doRg(){
    const n=document.getElementById('rN').value.trim();
    const e=document.getElementById('rE').value.trim();
    const p=document.getElementById('rP').value;
    const r=document.getElementById('rRl').value;
    if(!n||!e||!p){sErr('rEr','Nhập đầy đủ!');return}
    if(!e.includes('@')){sErr('rEr','Email không hợp lệ!');return}
    if(p.length<6){sErr('rEr','Mật khẩu ≥ 6 ký tự!');return}
    if(DB.users?.find(x=>x.email===e)){sErr('rEr','Email đã tồn tại!');return}
    
    // Tự động approved - không cần duyệt
    DB.users.push({id:Date.now(),name:n,email:e,password:p,role:r,status:'approved',devices:[],locked:false,createdAt:new Date().toISOString()});
    sv();
    
    swA('l');
    document.getElementById('lE').value=e;
    document.getElementById('lP').value='';
    const ok=document.getElementById('lOk');
    ok.textContent='✅ Đăng ký thành công! Hãy đăng nhập.';
    ok.style.display='block';
    setTimeout(()=>ok.style.display='none',6000);
}

function doLo(){
    if(ME){const u=DB.users?.find(x=>x.id===ME.id);if(u?.devices){u.devices=u.devices.filter(d=>d!==DI);sv()}}
    ME=null;EX=null;uUI();nv('home');
}
function sErr(id,m){const e=document.getElementById(id);if(!e)return;e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}

// UI
function uUI(){
    const L=!!ME,T=L&&(ME.role==='teacher'||ME.role==='admin'),A=L&&ME.role==='admin';
    let nh='<button class="on" onclick="nv(\'home\')" id="hn_home">🏠</button>';
    nh+='<button onclick="rqA(\'exams\')" id="hn_exams">📋</button>';
    nh+='<button onclick="rqA(\'schedule\')" id="hn_schedule">📅</button>';
    nh+='<button onclick="rqA(\'lb\')" id="hn_lb">🏆</button>';
    if(T)nh+='<button onclick="nv(\'create\')" id="hn_create">➕</button><button onclick="nv(\'grade\')" id="hn_grade">📝</button><button onclick="nv(\'honor\')" id="hn_honor">🌟</button>';
    if(A){const lc=DB.users?.filter(u=>u.locked).length||0;nh+=`<button onclick="nv('approvals')" id="hn_approvals">👥${lc?`<span class="bdg">${lc}</span>`:''}</button>`}
    document.getElementById('hNv').innerHTML=nh;
    
    if(L){
        document.getElementById('hRt').innerHTML=`<div class="husr" onclick="tgUM()"><span class="un">${ME.name}</span><div class="ua">${ME.name.split(' ').pop()[0]}</div><div class="umnu" id="um"><a onclick="nv('profile')">👤 Hồ sơ</a>${A?'<a onclick="nv(\'settings\')">⚙️ Cài đặt</a>':''}<div class="dv"></div><button class="dg" onclick="doLo()">🚪 Đăng xuất</button></div></div>`;
    }else{
        document.getElementById('hRt').innerHTML='<button class="lbtn" onclick="shA()">🔑 Đăng nhập</button>';
    }
    
    let sb='<div class="sbs"><div class="si on" onclick="nv(\'home\')"><span class="ic">🏠</span>Trang chủ</div><div class="si" onclick="rqA(\'exams\')"><span class="ic">📋</span>Phòng luyện</div><div class="si" onclick="nv(\'news\')"><span class="ic">📰</span>Tin tức</div><div class="si" onclick="rqA(\'schedule\')"><span class="ic">📅</span>Lịch học</div><div class="si" onclick="rqA(\'lb\')"><span class="ic">🏆</span>BXH</div></div>';
    if(T)sb+='<div class="sbs"><h4>Giáo viên</h4><div class="si" onclick="nv(\'create\')"><span class="ic">➕</span>Tạo đề</div><div class="si" onclick="nv(\'grade\')"><span class="ic">📝</span>Chấm bài</div><div class="si" onclick="nv(\'students\')"><span class="ic">👥</span>Học sinh</div><div class="si" onclick="nv(\'honor\')"><span class="ic">🌟</span>Vinh danh</div></div>';
    if(A)sb+='<div class="sbs"><h4>Admin</h4><div class="si" onclick="nv(\'admin\')"><span class="ic">🛡️</span>Quản trị</div><div class="si" onclick="nv(\'approvals\')"><span class="ic">👥</span>Quản lý TK</div><div class="si" onclick="nv(\'newsEditor\')"><span class="ic">📰</span>QL tin</div><div class="si" onclick="nv(\'settings\')"><span class="ic">⚙️</span>Cài đặt</div></div>';
    sb+='<div class="sbs"><h4>Liên kết</h4><div class="si" onclick="window.open(DB.contact?.facebook||\'#\')"><span class="ic">📘</span>Facebook</div></div>';
    document.getElementById('sb').innerHTML=sb;
}

function rqA(pg){if(!ME){shA();return}nv(pg)}
function tgUM(){const u=document.getElementById('um');if(u)u.classList.toggle('show')}
document.addEventListener('click',e=>{if(!e.target.closest('.husr')){const u=document.getElementById('um');if(u)u.classList.remove('show')}});
function tgSB(){document.getElementById('sb').classList.toggle('open');document.getElementById('sbO').classList.toggle('show')}
function uMq(){const el=document.getElementById('mqB'),tx=document.getElementById('mqT');if(DB.marquee&&DB.marquee.trim()){el.classList.remove('hide');tx.textContent=DB.marquee}else el.classList.add('hide')}

function nv(pg){
    const pr=['exams','profile','create','grade','students','admin','approvals','newsEditor','settings','lb','schedule','honor'];
    if(pr.includes(pg)&&!ME){shA();return}
    if(['create','grade','students','honor'].includes(pg)&&ME?.role==='student'){tt('Không quyền!','er');return}
    if(['admin','approvals','newsEditor','settings'].includes(pg)&&ME?.role!=='admin'){tt('Admin only!','er');return}
    document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
    document.querySelectorAll('.si').forEach(s=>s.classList.remove('on'));
    document.querySelectorAll('.hnav button').forEach(b=>b.classList.remove('on'));
    const m={home:'pgHome',exams:'pgExams',profile:'pgProfile',create:'pgCreate',grade:'pgGrade',students:'pgStudents',news:'pgNews',admin:'pgAdmin',approvals:'pgApprovals',newsEditor:'pgNewsEd',lb:'pgLb',result:'pgResult',settings:'pgSettings',schedule:'pgSchedule',honor:'pgHonor'};
    if(m[pg])document.getElementById(m[pg]).classList.add('on');
    const hn=document.getElementById('hn_'+pg);if(hn)hn.classList.add('on');
    document.getElementById('sb').classList.remove('open');document.getElementById('sbO').classList.remove('show');
    const f={home:rH,exams:rEx,profile:rPr,create:rCr,grade:rGr,students:rSt,news:rNw,admin:rAd,approvals:rAp,newsEditor:rNE,lb:rLb,settings:rSe,schedule:rSch,honor:rHn};
    if(f[pg])f[pg]();
    window.scrollTo({top:0,behavior:'smooth'});
    setTimeout(()=>{if(window.MathJax)MathJax.typesetPromise()},300);
}

// HOME
function rH(){

function prTxt(txt){const R={mcqs:[],essays:[]};const ls=txt.split('\n').map(l=>l.trim());let sec=null,cq=null,csb=null;
ls.forEach(l=>{if(!l)return;if(/\[?\s*TRẮC\s*NGHIỆM\s*\]?/i.test(l)){sec='m';if(cq)svQ();cq=null;return}if(/\[?\s*TỰ\s*LUẬN\s*\]?/i.test(l)){sec='e';if(cq)svQ();cq=null;return}if(!sec)sec='m';
const qm=l.match(/^Câu\s+(\d+)\s*(?:\(([\d.,]+)\s*(?:điểm|đ)\))?\s*[:\.\)]\s*(.*)/i);
if(qm){if(cq)svQ();cq={id:parseInt(qm[1]),text:'Câu '+qm[1]+(qm[2]?' ('+qm[2]+'đ)':'')+': '+(qm[3]||''),opts:[],subs:[],cor:null,pts:qm[2]?parseFloat(qm[2].replace(',','.')):null,type:sec==='m'&&R.mcqs.length<12?'m':'e'};csb=null;return}
if(!cq)return;
const om=l.match(/^([A-D])\s*[\.\)\:]\s*(.+)/);if(om&&cq.type==='m'){cq.opts.push({l:om[1].toUpperCase(),t:om[2].trim()});return}
const am=l.match(/^(?:Đáp\s*án|ĐA|Đ\.A)\s*[:\.]?\s*([A-D])/i);if(am&&cq.type==='m'){cq.cor=am[1].toUpperCase();return}
const sm=l.match(/^([a-e])\s*[\)\.]\s*(.+)/);if(sm&&cq.type==='e'){csb={l:sm[1],t:sm[2].trim()};cq.subs.push(csb);return}
if(csb)csb.t+=' '+l;else cq.text+=' '+l});
if(cq)svQ();
function svQ(){if(cq.type==='m'&&R.mcqs.length<12){while(cq.opts.length<4)cq.opts.push({l:['A','B','C','D'][cq.opts.length],t:'—'});if(!cq.cor)cq.cor='A';R.mcqs.push(cq)}else if(R.essays.length<6){if(!cq.subs.length)cq.subs.push({l:'a',t:''});R.essays.push(cq)}}
while(R.mcqs.length<12){const i=R.mcqs.length+1;R.mcqs.push({id:i,text:`Câu ${i}:`,opts:[{l:'A',t:'A'},{l:'B',t:'B'},{l:'C',t:'C'},{l:'D',t:'D'}],cor:'A',type:'m'})}

R.mcqs.forEach((q,i)=>q.id=i+1);R.essays.forEach((q,i)=>{q.id=13+i;if(!q.pts)q.pts=dp[i]||1});return R}

function dlTpl(){const t=`[TRẮC NGHIỆM]\n\nCâu 1: Rút gọn $A = \\sqrt{12} + \\sqrt{27} - \\sqrt{75}$\nA. $\\sqrt{3}$\nB. $2\\sqrt{3}$\nC. $-\\sqrt{3}$\nD. $3\\sqrt{3}$\nĐáp án: A\n\nCâu 2: Nghiệm $x^2-5x+6=0$:\nA. x=2; x=3\nB. x=-2; x=-3\nC. x=1; x=6\nD. x=-1; x=-6\nĐáp án: A\n\nCâu 3: $\\sin 60°$=\nA. $\\frac{\\sqrt{3}}{2}$\nB. $\\frac{1}{2}$\nC. $\\frac{\\sqrt{2}}{2}$\nD. 1\nĐáp án: A\n\nCâu 4: $(x^3-3x+1)'=$\nA. $3x^2-3$\nB. $x^2-3$\nC. $3x^2+3$\nD. $3x-3$\nĐáp án: A\n\nCâu 5: $\\log_2 8=$\nA. 3\nB. 2\nC. 4\nD. 8\nĐáp án: A\n\nCâu 6: Diện tích tròn r:\nA. $\\pi r^2$\nB. $2\\pi r$\nC. $\\pi r$\nD. $\\pi r^2/2$\nĐáp án: A\n\nCâu 7: Thể tích cầu R:\nA. $\\frac{4}{3}\\pi R^3$\nB. $4\\pi R^2$\nC. $\\pi R^3$\nD. $\\frac{4}{3}R^3$\nĐáp án: A\n\nCâu 8: $|3+4i|=$\nA. 5\nB. 7\nC. 25\nD. 1\nĐáp án: A\n\nCâu 9: $\\lim \\frac{2n+1}{n+3}=$\nA. 2\nB. 1\nC. 3\nD. $\\infty$\nĐáp án: A\n\nCâu 10: $C_5^2=$\nA. 10\nB. 20\nC. 5\nD. 25\nĐáp án: A\n\nCâu 11: P(sấp) xu:\nA. 1/2\nB. 1/3\nC. 1/4\nD. 1\nĐáp án: A\n\nCâu 12: $2x+3=7$ => x=\nA. 2\nB. 3\nC. 1\nD. 4\nĐáp án: A\n\n[TỰ LUẬN]\n\nCâu 1 (1.5 điểm):\na) Rút gọn $A=\\sqrt{12}+\\sqrt{27}-\\sqrt{75}$\nb) Giải hệ $2x-y=5; x+y=4$\n\nCâu 2 (1.0 điểm): Parabol $y=x^2$ và $y=2x+m-1$\na) Giao điểm khi m=2\nb) Tìm m cắt 2 điểm\n\nCâu 3 (1.5 điểm): Thuyền 30km\na) Tính vận tốc\n\nCâu 4 (1.0 điểm): 5 đỏ 3 xanh\na) Số cách lấy 2\nb) P(2 đỏ)\n\nCâu 5 (1.5 điểm): Đường tròn (O)\na) CM AOCM nội tiếp\nb) CM MN//AB\n\nCâu 6 (0.5 điểm): x,y>0, x+y≤2\na) Min $P=\\frac{1}{x^2+y^2}+\\frac{2}{xy}$`;const b=new Blob([t],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='TAPL_mau.txt';a.click();URL.revokeObjectURL(u);tt('📥 Tải mẫu OK','ok')}

<div class="cd"><h3>📋 Đã đăng (${(DB.news||[]).length})</h3>${(DB.news||[]).map(n=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f5f5f5"><div style="display:flex;align-items:center;gap:6px">${n.image?`<img src="${n.image}" style="width:36px;height:36px;border-radius:6px;object-fit:cover">`:`<span style="font-size:18px">${n.emoji||'📄'}</span>`}<div><b>${n.title}</b><div style="font-size:9px;color:var(--g)">${new Date(n.createdAt).toLocaleDateString('vi-VN')}</div></div></div><button class="btn bd bsm" onclick="dlN(${n.id})">🗑️</button></div>`).join('')||'<p style="color:var(--g)">Chưa có</p>'}</div></div>`;
document.getElementById('pgNewsEd').innerHTML=h;niD=null}
function oNI(e){const f=e.target.files[0];if(!f)return;if(f.size>2e6){tt('Max 2MB!','er');return}const r=new FileReader();r.onload=ev=>{niD=ev.target.result;const a=document.getElementById('nIA');if(a){a.classList.add('has');a.innerHTML=`📷 OK<img src="${niD}">`}};r.readAsDataURL(f)}
function addN(){const t2=document.getElementById('nTt').value.trim(),c=document.getElementById('nCt')?.value||'',em=document.getElementById('nEm')?.value||'📢';if(!t2){tt('Nhập tiêu đề!','er');return}if(!DB.news)DB.news=[];DB.news.unshift({id:Date.now(),title:t2,content:c,emoji:em,image:niD,createdAt:new Date().toISOString()});sv();rNE();tt('Đăng OK','ok')}
function dlN(id){DB.news=(DB.news||[]).filter(n=>n.id!==id);sv();rNE();tt('Xóa','ok')}

// SCHEDULE
function rSch(){const ds=['T2','T3','T4','T5','T6','T7','CN'],ts2=['07:00-08:30','08:45-10:15','10:30-12:00','13:30-15:00','15:15-16:45','19:00-20:30'],cE=ME&&(ME.role==='teacher'||ME.role==='admin');
let h='<h1 style="margin-bottom:12px">📅 Lịch học / thi</h1><div class="cd"><div class="ttb"><table><thead><tr><th style="width:80px">Giờ</th>';
ds.forEach(d=>h+=`<th>${d}</th>`);h+='</tr></thead><tbody>';
ts2.forEach(t=>{h+=`<tr><td class="tc">${t}</td>`;ds.forEach(d=>{const k=`${d}_${t}`,sl=(DB.schedule||{})[k]||[];h+='<td>';sl.forEach((s,i)=>{h+=`<div class="slot ${s.type==='exam'?'se':''}">${s.title||''}${cE?` <span style="cursor:pointer;font-size:8px;color:var(--r)" onclick="rmSl('${k}',${i})">✕</span>`:''}</div>`});if(cE)h+=`<div style="font-size:9px;color:var(--bl);cursor:pointer;font-weight:600" onclick="opSl('${d}','${t}')">+</div>`;h+='</td>'});h+='</tr>'});
h+='</tbody></table></div></div>';document.getElementById('pgSchedule').innerHTML=h}
function opSl(d,t){document.getElementById('slD').value=d;document.getElementById('slTi').value=t;document.getElementById('slTt').value='';document.getElementById('slM').classList.add('show')}
function clsSl(){document.getElementById('slM').classList.remove('show')}
function addSl(){const d=document.getElementById('slD').value,t=document.getElementById('slTi').value,t2=document.getElementById('slTt').value.trim(),ty=document.getElementById('slTy').value;if(!t2){tt('Nhập tiêu đề!','er');return}const k=`${d}_${t}`;if(!DB.schedule)DB.schedule={};if(!DB.schedule[k])DB.schedule[k]=[];DB.schedule[k].push({title:t2,type:ty});sv();clsSl();rSch();tt('Thêm OK','ok')}
function rmSl(k,i){if(DB.schedule?.[k]){DB.schedule[k].splice(i,1);if(!DB.schedule[k].length)delete DB.schedule[k];sv();rSch();tt('Xóa OK','ok')}}

// SETTINGS
function rSe(){if(ME?.role!=='admin')return;const c=DB.contact||{};
document.getElementById('pgSettings').innerHTML=`<h1 style="margin-bottom:12px">⚙️ Cài đặt</h1><div class="sgr">
<div class="cd"><h2>📢 Dòng thông báo</h2><div class="fg"><label>Nội dung</label><textarea class="fi" id="sMq" rows="2" style="resize:vertical;font-family:inherit">${DB.marquee||''}</textarea></div><button class="btn bp" onclick="svMq()">💾 Lưu</button></div>
<div class="cd"><h2>📞 Liên hệ</h2><div class="fg"><label>Email</label><input class="fi" id="sEm" value="${c.email||''}"></div><div class="fg"><label>SĐT</label><input class="fi" id="sPh" value="${c.phone||''}"></div><div class="fg"><label>Địa chỉ</label><input class="fi" id="sAd" value="${c.address||''}"></div><div class="fg"><label>Facebook</label><input class="fi" id="sFb" value="${c.facebook||''}"></div><button class="btn bp" onclick="svCt()">💾 Lưu</button></div>
<div class="cd"><h2>🔒 TK bị khóa (${(DB.users||[]).filter(u=>u.locked).length})</h2>${(DB.users||[]).filter(u=>u.locked).map(u=>`<div class="apc"><div style="display:flex;align-items:center;gap:6px"><div class="apv" style="background:#ffebee;color:var(--r)">${(u.name||'?').split(' ').pop()[0]}</div><div><b>${u.name}</b><div style="font-size:10px;color:var(--g)">${u.email}</div></div></div><button class="btn bs bsm" onclick="ulU(${u.id})">🔓 Mở khóa</button></div>`).join('')||'<p style="color:var(--g);text-align:center;padding:14px">✅ Không có TK bị khóa</p>'}</div></div>`}
function svMq(){DB.marquee=document.getElementById('sMq')?.value||'';sv();uMq();tt('Lưu OK','ok')}
function svCt(){if(!DB.contact)DB.contact={};DB.contact.email=document.getElementById('sEm')?.value||'';DB.contact.phone=document.getElementById('sPh')?.value||'';DB.contact.address=document.getElementById('sAd')?.value||'';DB.contact.facebook=document.getElementById('sFb')?.value||'';sv();tt('Lưu OK','ok');uUI()}

// OTHER
function rNw(){let h='<h1 style="margin-bottom:12px">📰 Tin tức</h1>';const news=DB.news||[];h+=news.length?`<div class="ngr">${news.map(n=>`<div class="nc"><div class="ni">${n.image?`<img src="${n.image}">`:(n.emoji||'📄')}</div><div class="nb"><h3>${n.title||''}</h3><p>${n.content||''}</p><div style="font-size:10px;color:#bbb;margin-top:4px">📅 ${new Date(n.createdAt).toLocaleDateString('vi-VN')}</div></div></div>`).join('')}</div>`:'<div class="cd" style="text-align:center;padding:30px;color:var(--g)"><h3>Chưa có</h3></div>';document.getElementById('pgNews').innerHTML=h}

function rSt(){const ss=(DB.users||[]).filter(u=>u.role==='student');let h=`<h1 style="margin-bottom:12px">👥 HS (${ss.length})</h1>`;if(!ss.length)h+='<div class="cd" style="text-align:center;padding:30px;color:var(--g)"><h3>Chưa có</h3></div>';else{h+='<div class="cd"><table class="tbl"><thead><tr><th>Tên</th><th>Email</th><th>Bài</th><th>TB</th></tr></thead><tbody>';ss.forEach(s=>{const ms=(DB.subs||[]).filter(x=>x.uid===s.id),gr=ms.filter(x=>x.st==='graded'),av=gr.length?gr.reduce((a,x)=>a+(x.ts||0),0)/gr.length:0;h+=`<tr><td><b>${s.name}</b></td><td style="font-size:10px">${s.email}</td><td>${ms.length}</td><td><b style="color:var(--r)">${av.toFixed(2)}</b></td></tr>`});h+='</tbody></table></div>'}document.getElementById('pgStudents').innerHTML=h}

function rAd(){const tu=(DB.users||[]).length-1,lc=(DB.users||[]).filter(u=>u.locked).length;document.getElementById('pgAdmin').innerHTML=`<h1 style="margin-bottom:12px">🛡️ Admin</h1><div class="ast"><div class="as2"><div class="ai" style="background:#e3f2fd">👥</div><div><div style="font-size:24px;font-weight:800">${tu}</div><div style="font-size:10px;color:var(--g)">TK</div></div></div><div class="as2"><div class="ai" style="background:#ffebee">🔒</div><div><div style="font-size:24px;font-weight:800">${lc}</div><div style="font-size:10px;color:var(--g)">Bị khóa</div></div></div><div class="as2"><div class="ai" style="background:#e8f5e9">📋</div><div><div style="font-size:24px;font-weight:800">${(DB.exams||[]).length}</div><div style="font-size:10px;color:var(--g)">Đề</div></div></div><div class="as2"><div class="ai" style="background:#fce4ec">📝</div><div><div style="font-size:24px;font-weight:800">${(DB.subs||[]).length}</div><div style="font-size:10px;color:var(--g)">Nộp</div></div></div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn bp" onclick="nv('approvals')">👥 Quản lý TK</button><button class="btn bo" onclick="nv('newsEditor')">📰 Tin tức</button><button class="btn bo" onclick="nv('settings')">⚙️ Cài đặt</button><button class="btn bd" onclick="if(confirm('Reset ALL?')){fb.ref('tapl').remove();localStorage.removeItem('tapl6');location.reload()}">🗑️ Reset</button></div>`}

function vwR(eid){const ex=(DB.exams||[]).find(e=>e.id===eid),sub=(DB.subs||[]).find(s=>s.eid===eid&&s.uid===ME.id);if(!ex||!sub||sub.st!=='graded'){tt('Chưa chấm!','wn');return}const t=sub.ts,mx=3+(ex.ePts||7),pc=Math.round(t/mx*100);let rc='rr2';if(pc>=80)rc='rg2';else if(pc>=60)rc='ro2';
document.getElementById('pgResult').innerHTML=`<div class="rh"><div class="srg ${rc}"><div class="nm">${t.toFixed(2)}</div><div class="of">/${mx}đ</div></div><h2>${ex.title}</h2><div class="srw"><div class="stb"><div class="sv" style="color:var(--gn)">${sub.mc||0}</div><div style="font-size:9px;color:#999">Đúng</div></div><div class="stb"><div class="sv" style="color:var(--r)">${Object.keys(sub.ans||{}).length-(sub.mc||0)}</div><div style="font-size:9px;color:#999">Sai</div></div><div class="stb"><div class="sv" style="color:var(--or)">${12-Object.keys(sub.ans||{}).length}</div><div style="font-size:9px;color:#999">Bỏ</div></div><div class="stb"><div class="sv">${Math.floor((sub.tu||0)/60)}:${String((sub.tu||0)%60).padStart(2,'0')}</div><div style="font-size:9px;color:#999">T.gian</div></div></div></div><div class="cd" style="text-align:center"><button class="btn bp" onclick="nv('exams')">← Về danh sách</button></div>`;nv('result')}

// UTILS
function shO(id){const e=document.getElementById(id);if(e)e.classList.add('show')}
function clsO(id){const e=document.getElementById(id);if(e)e.classList.remove('show')}
function opV(src){const img=document.getElementById('vI');if(img)img.src=src;document.getElementById('iv')?.classList.add('show')}
function clsV(){document.getElementById('iv')?.classList.remove('show')}
function tt(m,t){const c=document.getElementById('tss');if(!c)return;const ic={ok:'✅',er:'❌',in:'ℹ️',wn:'⚠️'},cl={ok:'tok',er:'ter',in:'tin',wn:'twn'};const e=document.createElement('div');e.className=`ts ${cl[t]||'tin'}`;e.innerHTML=`${ic[t]||'ℹ️'} ${m}`;c.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transform='translateX(110%)';e.style.transition='.3s';setTimeout(()=>e.remove(),300)},3500)}

// INIT
ensureAdmin();
uMq();
uUI();
rH();
console.log('🏠 Home rendered');

loadData(()=>{
    uMq();
    uUI();
    rH();
    rtSync();
    console.log('✅ TAPL fully ready!');
});
</script>
</body>
</html>
